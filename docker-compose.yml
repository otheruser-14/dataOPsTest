services:
  postgres:
    image: postgres:16
    container_name: dataops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build:
      context: ./api
    container_name: dataops-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"

  kafka:
    image: apache/kafka:3.9.1
    container_name: dataops-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_started
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Attente du démarrage de Kafka..."

        until /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do
          sleep 3
        done

        for topic in raw_data processed_data anomalies; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:29092 \
            --create \
            --if-not-exists \
            --topic "$$topic" \
            --partitions 1 \
            --replication-factor 1
        done

        echo "Initialisation Kafka terminée."

  airflow:
    image: apache/airflow:2.10.5
    container_name: dataops-airflow
    profiles:
      - orchestration
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/data/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_data:/opt/airflow/data

    command: standalone
  mlflow:
    build:
      context: ./mlflow
    container_name: dataops-mlflow
    profiles:
      - mlops
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow_data:/mlflow 

volumes:
  postgres_data:
  airflow_data:
  mlflow_data:
